name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Source-analysis tests invoke Xcode's SwiftParser/SwiftSyntax.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Vendored Expo prepare hooks rebuild/overwrite tracked artifacts. Build
      # candidates explicitly in staging via pnpm check instead.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm sdk54:tools:setup
      - run: pnpm check
      - run: pnpm sdk54:release:check
